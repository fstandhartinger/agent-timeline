limit_req_zone $binary_remote_addr zone=timeline_login:10m rate=5r/m;

server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

  location = /healthz {
    access_log off;
    return 200 "ok";
    add_header Content-Type text/plain;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  }
  location = /robots.txt { access_log off; }
  location = /api/login {
    limit_req zone=timeline_login burst=4 nodelay;
    limit_req_status 429;
    proxy_pass ${AGENT_TIMELINE_API_UPSTREAM};
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 20s;
  }
  location /api/ {
    proxy_pass ${AGENT_TIMELINE_API_UPSTREAM};
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
